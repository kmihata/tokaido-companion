// The allow-list. Nothing outside this is read, let alone shown.
const PICK = {
  trip:    ['title', 'direction', 'routeStart', 'routeEnd', 'walkingDayCount'],
  meta:    ['dataVersion'],
  day:     ['date', 'label', 'nominalDistanceKm', 'walkingDayNumber', 'publicEnd'],
  station: ['number', 'name', 'modern'],
  print:   ['number', 'title', 'series', 'artist', 'imagePath', 'institution', 'rightsStatus', 'sourceUrl'],
};
const only = (obj, keys) => Object.fromEntries(keys.filter((k) => k in obj).map((k) => [k, obj[k]]));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KM_MI = 0.621371;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pretty = (iso) => { const [y, m, d] = iso.split('-'); return `${+d} ${MONTHS[+m - 1]}`; };

async function get(p) {
  const r = await fetch(p, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`${p}: ${r.status}`);
  return r.json();
}

// An equirectangular sketch with a latitude correction. Deliberately not a
// slippy map: no tile server is contacted, so this page cannot run up against
// OpenStreetMap's tile policy the way the field app once did, and it works
// with scripting restricted to this file.
function routeSvg(features, labels) {
  const lines = [];
  for (const f of features) {
    const g = f.geometry;
    if (g.type === 'LineString') lines.push(g.coordinates);
    else if (g.type === 'MultiLineString') lines.push(...g.coordinates);
  }
  const pts = lines.flat();
  if (!pts.length) return '';

  // One equirectangular transform, latitude-corrected, shared by the route,
  // the coastline and the labels so they cannot drift apart. Deliberately not
  // a slippy map: nothing here requests a tile.
  const lat0 = pts.reduce((t, p) => t + p[1], 0) / pts.length;
  const k = Math.cos((lat0 * Math.PI) / 180);
  const xs = pts.map((p) => p[0] * k), ys = pts.map((p) => p[1]);
  let [x0, x1] = [Math.min(...xs), Math.max(...xs)];
  let [y0, y1] = [Math.min(...ys), Math.max(...ys)];
  // Breathing room, mostly vertical: the route is a thin east-west ribbon and
  // without this the coast is cropped flush against it and reads as noise.
  const mx = (x1 - x0) * 0.03, my = (y1 - y0) * 0.55;
  x0 -= mx; x1 += mx; y0 -= my; y1 += my;

  const W = 1000;
  const s = W / (x1 - x0);
  const H = Math.round((y1 - y0) * s);
  const X = (lon) => ((lon * k - x0) * s).toFixed(1);
  const Y = (lat) => (H - (lat - y0) * s).toFixed(1);
  const px = (p) => `${X(p[0])},${Y(p[1])}`;

  const land = COAST.split(';')
    .map((ring) => 'M' + ring.split('|').map((pair) => {
      const [lon, lat] = pair.split(',');
      return `${X(+lon)},${Y(+lat)}`;
    }).join('L') + 'Z')
    .join('');

  const route = lines
    .filter((l) => l.length > 1)
    .map((l) => `<path d="M${l.map(px).join('L')}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`)
    .join('');

  const marks = (labels ?? []).map((m) => {
    const anchor = m.align === 'end' ? 'end' : m.align === 'middle' ? 'middle' : 'start';
    const dx = anchor === 'end' ? -7 : anchor === 'middle' ? 0 : 7;
    const y = +Y(m.lat) + (m.below ? 15 : -7) + (m.dy ?? 0);
    return `<circle cx="${X(m.lon)}" cy="${Y(m.lat)}" r="3.2" fill="var(--ink)"/>` +
      `<text x="${+X(m.lon) + dx}" y="${y}" text-anchor="${anchor}"${m.big ? ' class="big"' : ''}>${esc(m.name)}</text>`;
  }).join('');

  return `<svg class="route" viewBox="0 0 ${W} ${H}" role="img" aria-label="The Tokaido from Tokyo to Kyoto, drawn along the Pacific coast of Honshu">`
    + `<path d="${land}" fill="var(--land)" stroke="var(--coast)" stroke-width="0.8" fill-rule="evenodd"/>`
    + route + marks + `</svg>`;
}

/**
 * The day stops, which is the whole question the page exists to answer:
 * where is he on a given day. Named as CITIES — family cannot place
 * "Iwatsuka Station crossing", and for the rest of the world that is Nagoya.
 */
const NUDGE = { Kuwana: { below: true, dy: 13 } };

function labelsFrom(days, startPos) {
  const out = [{ name: 'Tokyo', lat: startPos[1], lon: startPos[0], big: true, align: 'end', below: false }];
  days.forEach((d, i) => {
    if (!d.publicEnd) return;
    out.push({
      name: d.publicEnd.city,
      lat: d.publicEnd.lat,
      lon: d.publicEnd.lon,
      // Alternate above and below so sixteen labels on one coast do not pile up.
      below: i % 2 === 1,
      align: 'middle',
      big: d.publicEnd.city === 'Kyoto',
      // Alternation resolves every collision but one: Kuwana sits south-west of
      // Nagoya, so its label rises into Nagoya's. Measured, not guessed — the
      // page was checked for overlapping label boxes and this was the only pair.
      ...(NUDGE[d.publicEnd.city] ?? {}),
    });
  });
  return out;
}

(async () => {
  const app = document.getElementById('app');
  try {
    const [metaRaw, tripRaw, daysRaw, stationsRaw, printsRaw, routeRaw] = await Promise.all([
      get('data/route-meta.json'), get('data/trip.json'), get('data/days.json'),
      get('data/stations.json'), get('data/hiroshige.json'), get('data/route.geojson'),
    ]);

    const km = metaRaw.totals.activeWalkingKm;
    const totalMi = km * KM_MI;
    const startPos = (routeRaw.features.find((f) => f.geometry.type === 'LineString')?.geometry.coordinates
      ?? routeRaw.features[0].geometry.coordinates[0])[0];
    const trip = only(tripRaw, PICK.trip);
    const meta = only(metaRaw, PICK.meta);
    const days = daysRaw.days.filter((d) => d.kind === 'walk').map((d) => only(d, PICK.day))
      .sort((a, b) => a.date.localeCompare(b.date));
    const towns = stationsRaw.stations.map((s) => only(s, PICK.station))
      .filter((s) => typeof s.number === 'number').sort((a, b) => a.number - b.number);
    const prints = printsRaw.images.map((p) => only(p, PICK.print)).sort((a, b) => a.number - b.number);

    app.innerHTML = `
      <h2>The walk</h2>
      <div class="figures">
        <div class="fig"><b>${km.toFixed(1)}</b><span>kilometres</span></div>
        <div class="fig"><b>${(km * KM_MI).toFixed(0)}</b><span>miles</span></div>
        <div class="fig"><b>${towns.length}</b><span>post towns</span></div>
        <div class="fig"><b>${trip.walkingDayCount}</b><span>walking days</span></div>
      </div>
      <p class="lede" style="margin-top:18px">
        ${esc(pretty(trip.routeStart))} to ${esc(pretty(trip.routeEnd))}, 2026.
        The Tōkaidō was the coast road between the shogun's capital and the emperor's,
        and its fifty-three post towns were strips of inn and shop frontage strung along it.
      </p>

      <h2>The route</h2>
      ${routeSvg(routeRaw.features, labelsFrom(days, startPos))}
      <p class="lede" style="font-size:15px">The road runs along the Pacific coast of Honshū, Tokyo at the east end and Kyoto at the west. The southward loop before Nagoya is the Saya Kaidō, the land detour around the Seven-ri sea crossing. Coastline from Natural Earth, public domain.</p>

      <h2>The days</h2>
      <p class="lede" style="font-size:15px;margin-bottom:14px">Where he finishes each day, how far he has walked, and how much is left.</p>
      <table><thead><tr><th>Day</th><th>Date</th><th>Finishes at</th><th class="n">Miles</th><th class="n">Walked so far</th><th class="n">Left</th></tr></thead><tbody>
      ${(() => { let cum = 0; return days.map((d) => {
        const mi = (d.nominalDistanceKm ?? 0) * KM_MI;
        cum += mi;
        const n = d.walkingDayNumber ?? (/Walk\s+(\S+)/.exec(d.label ?? '')?.[1] ?? '');
        return `<tr>
          <td>${esc(n)}</td>
          <td style="white-space:nowrap">${esc(pretty(d.date))}</td>
          <td><b>${esc(d.publicEnd?.city ?? '')}</b></td>
          <td class="n">${mi.toFixed(1)}</td>
          <td class="n">${cum.toFixed(0)}</td>
          <td class="n">${(totalMi - cum).toFixed(0)}</td>
        </tr>`;
      }).join(''); })()}
      </tbody></table>

      <h2>The fifty-three post towns</h2>
      <div class="towns">
        ${towns.map((s) => `<div><i>${s.number}</i> ${esc(s.name)}${s.modern && s.modern !== s.name.replace(/-juku$/, '') ? ` <i>· ${esc(s.modern)}</i>` : ''}</div>`).join('')}
      </div>

      <h2>Hiroshige's fifty-three stations</h2>
      <p class="lede" style="font-size:15px">${esc(prints[0]?.series ?? '')}, by ${esc(prints[0]?.artist ?? '')}.</p>
      <div class="prints">
        ${prints.map((p) => `<figure>
          <img src="${esc(p.imagePath)}" alt="${esc(p.title)}" loading="lazy" width="720" height="480">
          <figcaption><b>${p.number}</b> ${esc(p.title)}<br><a href="${esc(p.sourceUrl)}" rel="noreferrer">${esc(p.institution)}</a></figcaption>
        </figure>`).join('')}
      </div>`;

    document.getElementById('attrib').innerHTML =
      `Route derived from <a href="${esc(metaRaw.source.url)}" rel="noreferrer">${esc(metaRaw.source.name)}</a> — ${esc(metaRaw.source.attribution)}. Shared under the same licence.`;
    document.getElementById('ver').textContent =
      `Route data ${meta.dataVersion}. Distances are measured on the traced line; nobody has yet walked it on the ground.`;
  } catch (e) {
    app.innerHTML = `<p class="err">The route data did not load. ${esc(e.message)}</p>`;
  }
})();
</script>
